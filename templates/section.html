{% extends "base.html" %}
{% block title %}{{ section.title }} - {{ config.title }}{% endblock %}
{% block content %}
<h1>{{ section.title }}</h1>
<ul>
{% for p in section.pages %}
<li><a href="{{ p.permalink }}">{{ p.title }}</a> <time datetime="{{ p.date }}">{{ p.date }}</time></li>
{% endfor %}
</ul>
{% endblock %}
